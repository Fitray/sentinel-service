services:
  sentinel-postgres:
    image: dhi.io/postgres:18
    container_name: sentinel-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always
  
  postgres-migrate:
    image: migrate/migrate:v4.19.1
    container_name: app-postgres-migrate
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
  
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: sentinel-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:sentinel-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"